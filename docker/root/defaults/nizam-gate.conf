access_log /var/log/nginx/access.log nizam_no_query;
# Plain HTTP sent to the HTTPS port; $http_host keeps whatever port the client used.
error_page 497 =301 https://$http_host$request_uri;

location SUBFOLDERauth/ {
  proxy_set_header        Host $host;
  proxy_set_header        X-Real-IP $remote_addr;
  proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header        X-Forwarded-Proto $scheme;
  proxy_http_version      1.1;
  client_max_body_size    16k;
  proxy_pass              http://127.0.0.1:GATE_PORT;
}

# Selkies, as the base image's `SUBFOLDERapi` location serves it, plus the
# session token taken from the gate's cookie (conf.d/nizam-gate-http.conf).
location SUBFOLDERapi/ {
  set                     $args $nizam_args;
  proxy_set_header        Authorization $nizam_authorization;
  proxy_set_header        Upgrade $http_upgrade;
  proxy_set_header        Connection "upgrade";
  proxy_set_header        Host $host;
  proxy_set_header        X-Real-IP $remote_addr;
  proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header        X-Forwarded-Proto $scheme;
  proxy_http_version      1.1;
  proxy_read_timeout      3600s;
  proxy_send_timeout      3600s;
  proxy_connect_timeout   3600s;
  proxy_buffering         off;
  proxy_request_buffering off;
  client_max_body_size    0;
  proxy_pass              http://127.0.0.1:CWS;
}
