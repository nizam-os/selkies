# The gate's session cookie in the two forms Selkies reads a session token in
# (the `SUBFOLDERapi/` location of nizam-gate.conf): a Bearer header, and
# `?token=` ahead of the request's own query, which is the only place its
# WebSocket handshake looks. A request without the cookie passes neither, so a
# header a client sends itself never reaches Selkies.
map $cookie_sid $nizam_authorization {
  ""      "";
  default "Bearer $cookie_sid";
}
map $cookie_sid $nizam_args {
  ""      $args;
  default "token=$cookie_sid&$args";
}

# Queries and the Referer header stay out of the access log: nothing the
# browser sends carries the token now, but a link made before this image did.
log_format nizam_no_query '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                          '"$http_user_agent"';
