# The session token rides the page's query string (Selkies 2.0 reads it there)
# and every Referer after it, so neither reaches the access log.
log_format nizam_no_query '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                          '"$http_user_agent"';
