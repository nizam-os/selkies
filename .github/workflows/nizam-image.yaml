# Builds Chromium with the nizam dashboard (docker/Dockerfile) for amd64 and
# arm64 and publishes it as ghcr.io/<owner>/selkies-chromium, which
# docker/compose.yaml pulls.
#
# A push to main publishes `latest` and `sha-<commit>`; a run by hand on any
# other branch publishes `sha-<commit>` only, so `latest` always follows main.
# Only the final stage's version check runs under QEMU for arm64: the UI stage
# builds on the runner's own platform.
name: Nizam image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - addons/nizam-dashboard/**
      - addons/selkies-web-core/**
      - addons/selkies-dashboard/src/**
      - addons/universal-touch-gamepad/**
      - docker/**
      - .github/workflows/nizam-image.yaml

permissions:
  contents: read
  packages: write

concurrency:
  group: nizam-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/selkies-chromium
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nizam-image
          cache-to: type=gha,scope=nizam-image,mode=max
